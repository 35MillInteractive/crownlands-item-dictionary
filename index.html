<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Crownlands Item Dictionary</title>
<style>
:root{--gold:#d9b46a;--ember:#e0662a;--slot:#1b1612;--edge:#5a4630}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#e8dcc4;font-family:Georgia,"Times New Roman",serif;
background:radial-gradient(ellipse at 50% 120%,rgba(224,102,42,.22),transparent 60%),
radial-gradient(ellipse at 50% -20%,rgba(217,180,106,.10),transparent 55%),
repeating-linear-gradient(45deg,#15110e 0 3px,#17130f 3px 6px),#120e0b}
header{padding:22px 28px 10px;text-align:center;border-bottom:1px solid #3a2c1d;background:linear-gradient(#0c0907e0,#0c090700)}
h1{margin:0;font-variant:small-caps;letter-spacing:4px;color:var(--gold);text-shadow:0 0 12px #e0662a66}
.sub{color:#a8957a;font-size:13px;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 20px}
.tab{background:#221b15;border:1px solid var(--edge);color:#cdb995;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:13px;border-radius:2px}
.tab:hover{border-color:var(--gold)}.tab.on{background:linear-gradient(#5a3a1c,#2c1d10);color:#fff;border-color:var(--gold)}
.tab.unres{border-color:#8a3a2a;color:#f0a090}.tab.unres.on{background:linear-gradient(#6a2418,#2c0e08)}
#q{background:#0f0c09;border:1px solid var(--edge);color:#eee;padding:7px 12px;width:260px;font-family:inherit}
main{max-width:1250px;margin:0 auto;padding:10px 20px 50px}
.panel{background:linear-gradient(#211a14ee,#16110dee);border:2px solid #4a3926;box-shadow:inset 0 0 40px #000a,0 6px 30px #000;padding:16px;margin-bottom:22px}
.panel h2{margin:0 0 10px;font-size:15px;letter-spacing:2px;font-variant:small-caps;color:var(--gold);border-bottom:1px solid #3a2c1d;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px}
.slot{width:92px;height:92px;position:relative;cursor:pointer;background:radial-gradient(circle at 50% 40%,#2b231b,var(--slot) 70%);border:1px solid #3e3022;box-shadow:inset 0 0 12px #000;transition:.12s}
.slot:hover{border-color:var(--gold);box-shadow:inset 0 0 12px #000,0 0 10px #d9b46a66}
.slot img{width:100%;height:100%;object-fit:contain;padding:6px}
.slot .flag{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#c0402a;box-shadow:0 0 4px #f60}
.slot .lbl{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;background:#000a;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip{position:fixed;pointer-events:none;display:none;max-width:280px;background:#0d0a08f2;border:1px solid var(--gold);padding:8px 10px;font-size:13px;z-index:9;box-shadow:0 4px 16px #000}
#tip b{color:var(--gold);display:block;margin-bottom:3px}
#detail{display:none;max-width:980px;margin:20px auto}
.insp{display:grid;grid-template-columns:380px 1fr;gap:24px}
.big{background:radial-gradient(circle,#3a2a1a,#120d09 70%);border:2px solid var(--edge);aspect-ratio:1;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 50px #000}
.big img{max-width:92%;max-height:92%}
.name{font-size:28px;color:var(--gold);font-variant:small-caps;margin:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{border:1px solid var(--edge);background:#1a140f;padding:3px 9px;font-size:12px}
.pill.tag{color:#ffcf6e;border-color:#a27a2e;background:#2b200f}.pill.id{color:#ffd78a}.tbd{color:#ff8b73!important;font-style:italic}
.short{font-style:italic;color:#e9cf9c;border-left:3px solid var(--ember);padding-left:10px}
.long{line-height:1.6;color:#d8cbb2}
.note{font-size:12px;color:#9c8b72;margin-top:12px}
.miss{background:#3a120c;border:1px solid #8a3a2a;padding:8px 12px;margin:10px 0;color:#ffb3a3;font-size:14px}
.back{background:linear-gradient(#5a3a1c,#2c1d10);border:1px solid var(--gold);color:#fff;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:14px}
.file{font-family:Consolas,monospace;font-size:11px;color:#7d6d58;word-break:break-all;margin-top:8px}
.empty{color:#8a7a62;text-align:center;padding:30px}
@media(max-width:800px){.insp{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Crownlands Item Dictionary</h1><div class="sub">Altonis: Afterfall · 35 Mill Interactive · <span id="cnt"></span></div></header>
<div id="gridview"><div class="bar" id="tabs"></div><div class="bar"><input id="q" placeholder="Search name, ID, description…"></div><main id="main"></main></div>
<div id="detail" class="panel"></div><div id="tip"></div>
<script>
const ITEMS=[{"cat": "Lore Items", "img": "Lore Items/01_Reality_Fragment.png", "name": "Reality Fragment", "id": "35000001", "short": "Torn from an unstable seam within The Scar, this fragment holds a pattern of reality that does not fully agree with the world around it.", "long": "Torn from an unstable seam within The Scar, this fragment holds a pattern of reality that does not fully agree with the world around it. Its resonance can anchor paths through impossible distance, though prolonged study leaves the unsettling impression that the fragment remains connected to somewhere else.", "type": "Quest / Progression Item", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/02_Scar_Shard.png", "name": "Scar Shard", "id": "35000002", "short": "Sharp-edged and faintly warm, the shard carries the same impossible resonance found throughout The Scar.", "long": "Sharp-edged and faintly warm, the shard carries the same impossible resonance found throughout The Scar. Its internal fractures shift when unobserved, suggesting that the object is less a piece of stone than a wound in reality forced into solid form.", "type": "Dungeon Treasure", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/03_Dimensionally_Displaced_Artifact.png", "name": "Dimensionally Displaced Artifact", "id": "35000003", "short": "Nothing in the Crownlands shares its material, geometry, or magical resonance.", "long": "Nothing in the Crownlands shares its material, geometry, or magical resonance. Recovered where incompatible realities bleed together, the artifact appears to have been fashioned for a purpose no living scholar can identify. Its world of origin may be unreachable, or may no longer exist. To those who study magic, such unanswered proof is beyond price.", "type": "Dimensional Dungeon Treasure", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/04_Jade_Fragment.png", "name": "Jade Fragment", "id": "35000004", "short": "Cold and almost inert, each fragment contains a precise vein of emerald light that stirs only when brought near others of its kind.", "long": "Cold and almost inert, each fragment contains a precise vein of emerald light that stirs only when brought near others of its kind. Scholars believe the pieces were never meant to remain separate; as they gather, their sleeping patterns begin to align, suggesting a power that can only awaken when the fragments are made whole.", "type": "Fragment / Progression Item", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/05_Emerald_Core.png", "name": "Emerald Core", "id": "35000005", "short": "Cut neither by tool nor hand, the core holds layer upon layer of emerald radiance around a dark, flawless center.", "long": "Cut neither by tool nor hand, the core holds layer upon layer of emerald radiance around a dark, flawless center. Its presence quiets lesser enchantments and draws the eye with the gravity of a royal jewel, yet no record explains who first shaped such objects or what complete design they once served. Institutions prize the core for what it can unlock; scholars prize it because its true purpose remains only partially understood.", "type": "Progression Core", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/06_Corroded_Token.png", "name": "Corroded Token", "id": "35000006", "short": "The token's surface has been eaten away by a force that resembles neither rust nor age.", "long": "The token's surface has been eaten away by a force that resembles neither rust nor age. What remains still answers to certain sealed passages and rites associated with the older Averai path, suggesting that its corrosion may be a mark of use rather than decay.", "type": "Progression Token", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/07_Gamblers_Token.png", "name": "Gambler's Token", "id": "35000007", "short": "Stamped with a shifting wager-mark, this token is accepted by hidden mechanisms and secretive brokers who value risk above law.", "long": "Stamped with a shifting wager-mark, this token is accepted by hidden mechanisms and secretive brokers who value risk above law. It is consumed when used, turning every locked door into a decision about whether the possible reward is worth the price of entry.", "type": "Key Token", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/08_Vexstone.png", "name": "Vexstone", "id": "35000008", "short": "Vexstone forms in sharp, unnatural angles, its dark facets holding currents of green and purple radiance that never seem to settle.", "long": "Vexstone forms in sharp, unnatural angles, its dark facets holding currents of green and purple radiance that never seem to settle. No scholar has determined whether the stone is a product of corruption or something far older awakened by it. Even the smallest fragment carries an unmistakable weight, as though it remembers a power the world has forgotten.", "type": "Rare Magical Material", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/09_Saibercat_Crystals.png", "name": "Saibercat Crystals", "id": "35000009", "short": "Found only where elusive Saibercats roam, these rare crystalline blooms trap luminous pollen within their lavender facets.", "long": "Found only where elusive Saibercats roam, these rare crystalline blooms trap luminous pollen within their lavender facets. Their impossible fragrance is harmless to most creatures, yet Saibercats react with immediate delight and uncontrollable excitement. Collectors, naturalists, and sanctuary keepers prize the crystals for their captivating beauty and their uncanny bond with these curious beasts.", "type": "Rare Botanical Crystal", "note": "Short text = first line of the Lore Bible entry.", "tags": ["Confirmed ID"], "missing": []}, {"cat": "Lore Items", "img": "Lore Items/ChatGPT Image Sep 21, 2026, 01_12_13 AM.png", "name": "Unnamed Image (Sep 21)", "id": null, "short": null, "long": null, "type": "Unidentified", "note": null, "tags": [], "missing": ["id", "short", "long"]}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/WhiteMagicFeat_Sanctified_Dawn_Ascension_Transparent.png", "name": "White Magic", "id": "35010001", "short": "Heal wounds, cleanse afflictions, protect allies, and restore the fallen.", "long": "White Magic is the disciplined study of preservation. Its practitioners mend grievous wounds, restore fallen allies, and raise magical barriers capable of carrying an adventuring party through otherwise fatal encounters.", "type": "Feat · Core", "note": "Learned by consuming Primer of the White Veil (35020001).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/WhiteMagicFeatGiver_Sanctified_Dawn_Codex_Transparent.png", "name": "Primer of the White Veil", "id": "35020001", "short": "Consume to learn White Magic.", "long": "Its teachings follow the fragile boundary between suffering and renewal. White Magic encompasses healing, cleansing, protective spellcraft, and resurrection, placing the preservation of life at the heart of the caster's art.", "type": "Feat Unlocker · Core", "note": "Teaches feat White Magic (35010001).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/BlackMagicFeat_Crowned_Eclipse_Transparent.png", "name": "Black Magic", "id": "35010002", "short": "Wield fire, ice, and raw magical force in battle.", "long": "Black Magic shapes mana into a weapon. Its practitioners wield searing flame, killing frost, and raw non-elemental force to overwhelm enemies through direct and decisive destruction.", "type": "Feat · Core", "note": "Learned by consuming Primer of the Black Flame (35020002).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/BlackMagicFeatGiver_Crowned_Eclipse_Codex_Transparent.png", "name": "Primer of the Black Flame", "id": "35020002", "short": "Consume to learn Black Magic.", "long": "These pages introduce the forces a battle mage must learn to command. Black Magic turns fire, ice, and raw magical energy toward direct combat, giving destructive intent a disciplined arcane form.", "type": "Feat Unlocker · Core", "note": "Teaches feat Black Magic (35010002).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/ArcaneKnightFeat_Bright_Transparent.png", "name": "Arcane Knight", "id": "35010005", "short": "Combine air steps, conjured swords, provocation, and armor-breaking magic.", "long": "Arcane Knights carry magic directly into the front line. Their teachings reinforce armor, break enemy defenses, provoke hostile attention, and employ brief movements through the air to control the rhythm of close combat.", "type": "Feat · Core", "note": "Learned by consuming Oathplate Insignia (35020005).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/ArcaneKnightFeatItem_Bright_Transparent (1).png", "name": "Oathplate Insignia", "id": "35020005", "short": "Consume to learn Arcane Knight.", "long": "The insignia embodies a discipline in which movement, steel, and spell serve the same purpose. Arcane Knights practice air steps, conjured swords, provocation, and armor-breaking magic to shape the course of battle.", "type": "Feat Unlocker · Core", "note": "Teaches feat Arcane Knight (35010005).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/WayfarerMagicFeat_Everpath_Waystar_Transparent.png", "name": "Wayfarer Magic", "id": "35010006", "short": "Practice utility magic for travel, camp life, exploration, and survival.", "long": "Wayfarer Magic concerns itself with the small workings that keep an expedition alive. Its practitioners preserve memories, kindle enchanted campfires, manipulate airflow, create signals, and perform useful magic without requiring a formal battlefield role.", "type": "Feat · Core", "note": "Learned by consuming Wayfarer's Field Grimoire (35020006).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/WayfarerMagicFeatItem_Everpath_Pilgrims_Atlas_Transparent.png", "name": "Wayfarer's Field Grimoire", "id": "35020006", "short": "Consume to learn Wayfarer Magic.", "long": "Its weathered pages gather useful workings for the long road and the camp beyond the city walls. Wayfarer Magic brings practical spellcraft to exploration, camp life, and survival, including enchanted campfires and other everyday arcane tools.", "type": "Feat Unlocker · Core", "note": "Teaches feat Wayfarer Magic (35010006).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/RadiomancyFeat_Radiant_Crucible_Transparent.png", "name": "Radiomancy", "id": "35010007", "short": "Unleash scorching heat, blast waves, and unstable radiant force.", "long": "Radiomancers release mana as scorching waves, violent flares, and expanding bursts of force. Their magic is less precise than conventional battle sorcery, but exceptionally effective at controlling space and punishing clustered enemies.", "type": "Feat · Specialist", "note": "Learned by consuming Lens of the Scorched Meridian (35020007).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/RadiomancyFeatItem_Stellar_Crucible_Reliquary_Transparent.png", "name": "Lens of the Scorched Meridian", "id": "35020007", "short": "Consume to learn Radiomancy.", "long": "Through this damaged lens, light becomes an instrument of unbearable heat. Radiomancy channels scorching energy and explosive pressure into hostile waves of force, demanding command of a dangerously unstable art.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Radiomancy (35010007).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/CronomancyFeat_Chronal_Hourglass_Transparent_Final.png", "name": "Chronomancy", "id": "35010008", "short": "Manipulate quickness, borrowed time, slow falls, and temporal order.", "long": "Chronomancers accelerate allies, delay enemies, suspend consequences, and steal brief moments from events that have not yet occurred. Every working risks creating a debt that time may eventually attempt to reclaim.", "type": "Feat · Prestige", "note": "Learned by consuming Epoch Dial (35020008).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/ChronomancyFeatItem_Epoch_Dial_Transparent_Final.png", "name": "Epoch Dial", "id": "35020008", "short": "Consume to learn Chronomancy.", "long": "Its restless sand hints that a moment need not pass in only one direction. Chronomancy explores quickness, borrowed time, slowed falls, and the dangerous alteration of duration and temporal order.", "type": "Feat Unlocker · Prestige", "note": "Teaches feat Chronomancy (35010008).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/VeilcraftFeat_Refractive_Veil_Transparent_Final.png", "name": "Veilcraft", "id": "35010009", "short": "Conceal your presence with invisibility, misdirection, and unseen movement.", "long": "Veilcraft teaches the practitioner to hide their form, suppress their presence, and move through guarded spaces without drawing attention. Advanced workings blur the boundary between concealment and transformation.", "type": "Feat · Specialist", "note": "Learned by consuming Thread of the Hidden Veil (35020009).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/VeilcraftFeatItem_Refractive_Spindle_Transparent_Final.png", "name": "Thread of the Hidden Veil", "id": "35020009", "short": "Consume to learn Veilcraft.", "long": "The thread offers an introduction to the art of passing unnoticed. Veilcraft joins concealment, invisibility, and misdirection with unseen movement, teaching the caster to work at the edge of another's perception.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Veilcraft (35010009).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/PsychokinesisFeat_Sovereign_Will_Transparent.png", "name": "Psychokinesis", "id": "35010010", "short": "Project thought as telekinetic pushes, prismatic force, and psychic attacks.", "long": "Psychokinesis allows disciplined intent to push, strike, restrain, and shield without physical contact. Its practitioners treat concentration as both weapon and armor, imposing their will directly upon the material world.", "type": "Feat · Specialist", "note": "Learned by consuming Prism of the Unseen Hand (35020010).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/PsychokinesisFeatItem_Sovereign_Will_Reliquary_Transparent.png", "name": "Prism of the Unseen Hand", "id": "35020010", "short": "Consume to learn Psychokinesis.", "long": "The prism shifts in answer to thought, revealing the connection between will and force. Psychokinesis projects the mind outward through telekinetic pushes, prismatic workings, and psychic attacks.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Psychokinesis (35010010).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/EtherflightFeat_Transparent_Final.png", "name": "Etherflight", "id": "35010011", "short": "Take sustained flight through the rare magic of etheric wings.", "long": "Etherflight allows a practitioner to reject the pull of the earth and travel upon invisible magical currents. Because it bypasses walls, terrain, and many ordinary dangers, knowledge of the discipline is guarded more heavily than almost any conventional combat spell.", "type": "Feat · Prestige", "note": "Learned by consuming Feather of the Upper Current (35020011).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/EtherflightFeatItem_Transparent_Final.png", "name": "Feather of the Upper Current", "id": "35020011", "short": "Consume to learn Etherflight.", "long": "The feather belongs to a current beyond the reach of ordinary travelers. Etherflight teaches the rare, closely guarded art of sustained magical flight, expressed through the wings of ether.", "type": "Feat Unlocker · Prestige", "note": "Teaches feat Etherflight (35010011).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/MiraclesFeat_Transparent_Final.png", "name": "Miracles", "id": "35010012", "short": "Create pure water, nourishment, and gifts of natural abundance.", "long": "Miracles are not performed through healing alone, but through the sudden appearance of what life requires. Clean water, natural bounty, and other blessings are called forth where scarcity would otherwise prevail.", "type": "Feat · Specialist", "note": "Learned by consuming Vessel of First Water (35020012).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/MiraclesFeatItem_Transparent_Final.png", "name": "Vessel of First Water", "id": "35020012", "short": "Consume to learn Miracles.", "long": "The vessel preserves the promise of relief in a barren world. Miracles turn benevolent magic toward pure water, nourishment, and nature's gifts, answering need through the creation of abundance.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Miracles (35010012).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/WitchDoctorFeat_Spiritmask_Veve_Transparent_Final.png", "name": "Witch Doctor", "id": "35010013", "short": "Work poisons, charms, ritual totems, cleansing rites, and curses.", "long": "Witch Doctors combine herbal knowledge, spiritual bargaining, and deliberately imperfect magic. Their workings poison breath, place enchanted totems, cleanse harmful effects, and produce strange charms capable of bending normal magical limitations.", "type": "Feat · Prestige", "note": "Learned by consuming Fetish of the Crooked Root (35020013).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/WitchDoctorFeatItem_Ivory_Spiritroot_Reliquary_Transparent_Final.png", "name": "Fetish of the Crooked Root", "id": "35020013", "short": "Consume to learn Witch Doctor.", "long": "Root, bone, feathers, and binding cord hold the lessons of a crooked tradition. The Witch Doctor's art embraces poisons, charms, ritual totems, cleansing rites, and unpredictable curses.", "type": "Feat Unlocker · Prestige", "note": "Teaches feat Witch Doctor (35010013).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/KusenFeat_Riftstep_Ascension_Transparent.png", "name": "Kūsen Arts", "id": "35010014", "short": "Evade through phase shifts, instantaneous movement, and displacement.", "long": "Practitioners of the Kūsen Arts do not merely evade an attack; they abandon the space in which the attack was destined to land. To an observer, the movement appears as a sudden disappearance followed by a displaced gust and a fading afterimage.", "type": "Feat · Prestige", "note": "Learned by consuming Talisman of the Empty Step (35020014).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/KusenFeatItem_Riftstep_Waymark_Transparent.png", "name": "Talisman of the Empty Step", "id": "35020014", "short": "Consume to learn Kūsen Arts.", "long": "The talisman describes movement without the journey between departure and arrival. Kūsen Arts explore phase shifts, instantaneous displacement, and impossible evasion, turning the empty step into an arcane discipline.", "type": "Feat Unlocker · Prestige", "note": "Teaches feat Kūsen Arts (35010014).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/CorpseMageFeat_Mortuary_Transmutation_Transparent_Final.png", "name": "Corpsemage", "id": "35010015", "short": "Draw forbidden power from corpses, death rites, and lingering last breaths.", "long": "Corpsemancy treats the dead as vessels that have not yet exhausted their usefulness. Its practitioners invoke grave-born flame, manipulate ruined flesh, and draw dangerous power from what remains after life has departed.", "type": "Feat · Specialist", "note": "Learned by consuming The Ossuary Testament (35020015).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/CorpseMageFeatItem_Mortuary_Codex_Transparent_Final.png", "name": "The Ossuary Testament", "id": "35020015", "short": "Consume to learn Corpsemage.", "long": "Its pages regard death as a source of power still waiting to be drawn upon. Corpsemage teachings concern corpses, death rites, and lingering final breaths, opening a forbidden branch of arcane practice.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Corpsemage (35010015).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/ShadowArtsFeat_Umbral_Sovereign_Transparent_Final.png", "name": "Shadow Arts", "id": "35010016", "short": "Shape hostile shadows, false bodies, and independently moving darkness.", "long": "The Shadow Arts teach that every creature casts more than one shadow. Practitioners learn to call upon the hidden reflection, create false movements, and shape darkness into extensions of their own intent.", "type": "Feat · Specialist", "note": "Learned by consuming Ink of the Second Shadow (35020016).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/ShadowArtsFeatItem_Umbral_Vessel_Transparent.png", "name": "Ink of the Second Shadow", "id": "35020016", "short": "Consume to learn Shadow Arts.", "long": "The ink's second shadow reveals a darkness with a life apart from its source. Shadow Arts shape stolen shadows and false bodies, giving hostile darkness an independent form.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Shadow Arts (35010016).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/DominationFeat_Psionic_Dominion_Transparent_Final.png", "name": "Domination", "id": "35010017", "short": "Impose magical slumber, stir aggression, and bend another's will.", "long": "Domination reaches beyond persuasion and enters the territory of command. Its practitioners induce sleep, inflame aggression, and bend weakened minds toward obedience.", "type": "Feat · Specialist", "note": "Learned by consuming Edict of the Quiet Will (35020017).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/DominationFeatItem_Psionic_Codex_Transparent_Final.png", "name": "Edict of the Quiet Will", "id": "35020017", "short": "Consume to learn Domination.", "long": "The command within reaches beyond the obedience that ordinary words can demand. Domination works through magical slumber, bloodlust, and charms to suppress another's will and direct their behavior.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Domination (35010017).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/AncientMagicFeat_Bright_Rework_Transparent.png", "name": "Ancient Magic", "id": "35010018", "short": "Call catastrophic storms, starfire, meteors, and divine weapons.", "long": "Primeval Magic was shaped in an age when sorcery was measured by what it could destroy. Its workings call down stars, raise catastrophic storms, summon divine weapons, and tear open forces that modern schools were built specifically to contain.", "type": "Feat · Prestige", "note": "Learned by consuming Fragment of the First Cataclysm (35020018).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/AncientMagicFeatItem_Bright_Transparent.png", "name": "Fragment of the First Cataclysm", "id": "35020018", "short": "Consume to learn Ancient Magic.", "long": "The fragment carries the memory of devastation on a scale few living kingdoms have known. Ancient Magic draws upon storms, stars, meteors, and divine weapons, preserving a tradition of catastrophic sorcery.", "type": "Feat Unlocker · Prestige", "note": "Teaches feat Ancient Magic (35010018).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/SeerFeat_Transparent.png", "name": "Seer", "id": "35010019", "short": "Reveal distant sights and channel focused light into magical beams.", "long": "Seers use light not only to illuminate, but to reveal. Their magic pierces darkness, extends perception beyond ordinary limits, and concentrates radiant energy into precise manifestations.", "type": "Feat · Specialist", "note": "Learned by consuming Eye of the Far Light (35020019).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/SeerFeatItem_Transparent.png", "name": "Eye of the Far Light", "id": "35020019", "short": "Consume to learn Seer.", "long": "The eye looks outward toward places its bearer cannot ordinarily see. Seer teachings unite supernatural perception, distant vision, and revelation with focused workings of light, from sparks to beams.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Seer (35010019).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/StormcallingFeat_Contained_Thunderball_Transparent_Final.png", "name": "Stormcalling", "id": "35010020", "short": "Shape lightning into storms, focused beams, and spears.", "long": "Stormcallers draw electrical force from the air and shape it into beams, spears, and violent localized storms. Their magic is fast, direct, and exceptionally dangerous to anything caught between the caster and the point of impact.", "type": "Feat · Specialist", "note": "Learned by consuming Bottled Thunderhead (35020020).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/StormcallingFeatItem_Stormheart_Reliquary_Transparent_Final.png", "name": "Bottled Thunderhead", "id": "35020020", "short": "Consume to learn Stormcalling.", "long": "A tiny thunderhead churns within the sealed vessel. Stormcalling teaches lightning in several forms, gathering it into storms, concentrating it into beams, and shaping it into magical spears.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Stormcalling (35010020).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/BoneMageFeat_Boneweaving_Transparent_Final.png", "name": "Bone Mage", "id": "35010021", "short": "Shape bone into spikes, hurled skulls, and spiritual vessels.", "long": "Bonecraft transforms skeletal matter into spear, missile, and conduit. Its practitioners understand that bone remembers the shape of life even after flesh and thought have vanished.", "type": "Feat · Specialist", "note": "Learned by consuming Marrowbound Primer (35020021).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/BoneMageFeatItem.png", "name": "Marrowbound Primer", "id": "35020021", "short": "Consume to learn Bone Mage.", "long": "Polished bone protects the lessons held within this primer. Bone Mage spellcraft shapes skeletal matter into spikes and hurled skulls, while exploring its use as a vessel for spiritual power.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Bone Mage (35010021).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/GeomancyFeat_Gilded_Fault_Transparent_Final.png", "name": "Geomancy", "id": "35010022", "short": "Move earth and weaponize stone through boulders and sling shots.", "long": "Geomancers raise stone, cast boulders, and force the ground itself to answer their movements. Their magic is deliberate and heavy, trading speed for crushing force and control over terrain.", "type": "Feat · Specialist", "note": "Learned by consuming Tablet of the Moving Earth (35020022).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/GeomancyFeatItem_Faultbound_Grimoire_Transparent_Final.png", "name": "Tablet of the Moving Earth", "id": "35020022", "short": "Consume to learn Geomancy.", "long": "The moving landscape records a discipline written in the ground itself. Geomancy turns earth and stone into instruments of magic, moving terrain and directing boulders and sling shots as weapons.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Geomancy (35010022).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/TidebindingFeat_Refined_Transparent_Final.png", "name": "Tidebinding", "id": "35010023", "short": "Command water through compressed spheres, tidal waves, and geysers.", "long": "Tidebinders shape water into suspended spheres, surging waves, and eruptions from below. Their strength lies in displacement, pressure, and the ability to transform open ground into an extension of the sea.", "type": "Feat · Specialist", "note": "Learned by consuming Pearl of the Bound Tide (35020023).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/TidebindingFeatItem_Tideglass_Reliquary_Transparent_Final.png", "name": "Pearl of the Bound Tide", "id": "35020023", "short": "Consume to learn Tidebinding.", "long": "The sound within the pearl carries the weight and motion of a bound sea. Tidebinding compresses and releases water through spheres, tidal waves, and geysers, giving the tide a shape the caster can direct.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Tidebinding (35010023).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/BloodMagicFeat_Crimson_Covenant_Transparent.png", "name": "Blood Magic", "id": "35010024", "short": "Turn vitality, sacrifice, bleeding, and stolen life into magical power.", "long": "Blood Magic treats life itself as a source of mana. Its practitioners manipulate bleeding, sacrifice vitality for immediate power, and unleash crimson workings that become more dangerous as suffering spreads.", "type": "Feat · Specialist", "note": "Learned by consuming The Crimson Covenant (35020024).", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/BloodMagicFeatItem_Crimson_Covenant_Reliquary_Codex_Transparent.png", "name": "The Crimson Covenant", "id": "35020024", "short": "Consume to learn Blood Magic.", "long": "The undried signature binds the covenant to the life from which it was written. Blood Magic works through vitality, sacrifice, bleeding, and stolen life, treating the body's lifeblood as a source of arcane power.", "type": "Feat Unlocker · Specialist", "note": "Teaches feat Blood Magic (35010024).", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/Awakenings/VelariFeat_Crowned_Ascension_Transparent.png", "name": "Velari Awakening", "id": "35010003", "short": "Follow Altonis's sanctioned path to recognized magical awakening.", "long": "The dormant current within you has awakened. Through examination, ritual, and sanctioned instruction, your natural connection to mana has been stabilized and formally recognized. You are now counted among the Velari—those permitted to study structured spellcraft under the authority of Altonis.", "type": "Awakening", "note": "Quest / script assigned; no consumable unlocker.", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/Awakenings/AveraiFeat_Tribal_Shadow_Transparent.png", "name": "Averai Awakening", "id": "35010004", "short": "Awaken through an ancient path independent of institutional authority.", "long": "The current within you has broken free. Through forbidden rite, personal trial, or ancient instruction, you have awakened as one of the Averai—the old name carried by those who wielded magic before Altonis sought to register, regulate, and define it.", "type": "Awakening", "note": "Quest / script assigned; no consumable unlocker.", "tags": [], "missing": []}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/HerbologistFeat_Verdant_Transparent.png", "name": "Verdant Arts", "id": "35010026", "short": "Command magical plants, awakened roots, mandrake traps, and poisonous blooms.", "long": null, "type": "Feat · Specialist", "note": "Old working name: Herbologist (icon filename kept). Learned by consuming The Evergarden Codex (35020026).", "tags": [], "missing": ["long"]}, {"cat": "Arcane Paths Feats", "img": "Arcane paths feats/UnboundArtsFeat_Volatile_Containment_Array_Transparent.png", "name": "Eldritch Arts", "id": "35010025", "short": "Inscribe lasting traps, webs, and sleep sigils in hostile magical geometry.", "long": null, "type": "Feat · Specialist", "note": "Icon filename says Unbound Arts (likely an old school name). Learned by consuming The Codex of Crooked Seals (35020025).", "tags": [], "missing": ["long"]}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/HerbologistFeatItem_Rosebound_Herbarium_Codex_Transparent.png", "name": "The Evergarden Codex", "id": "35020026", "short": "Consume to learn Verdant Arts.", "long": "Seeds, pressed leaves, and luminous sap crowd its living record of the wild. Verdant Arts draw on magical plants, awakened roots, mandrake traps, and poisonous blooms, bringing the dangers of growing things into spellcraft.", "type": "Feat Unlocker · Specialist", "note": "Icon file says Rosebound Herbarium Codex; mapped per Eric. Older flavor text was written for Rootbound Fieldbook.", "tags": [], "missing": []}, {"cat": "Feat Unlockers", "img": "Arcane paths feats/unlockers/UnboundArtsFeatItem_Crimson_Containment_Codex_Transparent.png", "name": "The Codex of Crooked Seals", "id": "35020025", "short": "Consume to learn Eldritch Arts.", "long": "The grooves rearrange into patterns that hold a working beyond the moment of inscription. Eldritch Arts employ persistent trap, web, and sleep sigils, joining seals and hostile geometry into a discipline of prepared magic.", "type": "Feat Unlocker · Specialist", "note": "Icon file says Unbound Arts / Crimson Containment Codex; mapped per Eric. Older flavor text was written for Sigilwright's Black Slate.", "tags": [], "missing": []}, {"cat": "Boss Ingredients", "img": "boss-ingredients/conquerors-fang.png", "name": "Conqueror's Fang", "id": "35081050", "short": "A battle-scarred boss fang threaded with amber light, used to forge Azure and Crimson Fury Crystals.", "long": "Taken from a defeated dungeon boss, this dark ivory fang retains the savage force of its former owner. Amber light seeps through a narrow fracture, brightening whenever steel draws near. Crafters draw upon its lingering ferocity to forge Azure and Crimson Fury Crystals, binding a measure of the creature's strength into a weapon's enhancement. Even severed from its bearer, the fang seems unwilling to surrender its bite.", "type": "Boss Crafting Ingredient", "note": null, "tags": ["Proposed ID"], "missing": []}, {"cat": "Boss Ingredients", "img": "boss-ingredients/dreadplate-fragment.png", "name": "Dreadplate Fragment", "id": "35081051", "short": "A heavy shard of boss armor, prized for the stubborn resilience it lends to Azure and Crimson Ward Crystals.", "long": "This thick, jagged fragment once shielded a dungeon boss from blows that would have shattered ordinary armor. Its dark surface bears the scars of that final battle, yet the layers beneath remain remarkably sound. Recovered only from boss encounters, Dreadplate is worked into Azure and Crimson Ward Crystals, lending their protective enchantments a resilience that survives even the creature it once guarded.", "type": "Boss Crafting Ingredient", "note": null, "tags": ["Proposed ID"], "missing": []}, {"cat": "Boss Ingredients", "img": "boss-ingredients/bound-ichor.png", "name": "Bound Ichor", "id": "35081052", "short": "A hardened droplet of boss essence that binds Verdant Fury and Ward Crystals into their stronger Azure forms.", "long": "Drawn from fallen dungeon bosses, this burgundy ichor has hardened into a droplet that refuses to lose its shape. Something beneath its glossy surface still moves. Scholars at the Last Span discovered that it can bind volatile magical forces without allowing them to tear each other apart. Crafters rely on this unsettling property when transforming Verdant Fury and Ward Crystals into their stronger Azure forms.", "type": "Boss Crafting Ingredient", "note": null, "tags": ["Proposed ID"], "missing": []}, {"cat": "Boss Ingredients", "img": "boss-ingredients/crown-ember.png", "name": "Crown Ember", "id": "35081053", "short": "An enduring boss ember cradled in a broken, crownlike shell, used to kindle the power required for Crimson enhancements.", "long": "Within a crownlike husk of charred material, a small ember burns without fuel. Recovered only from boss encounters, it carries a heat that ordinary furnaces cannot reproduce. During the forging of a Crimson Fury or Ward Crystal, this ember drives an Azure crystal beyond its former limits. Its blackened shell slowly crumbles as the fire within finds something new to inhabit.", "type": "Boss Crafting Ingredient", "note": null, "tags": ["Proposed ID"], "missing": []}, {"cat": "Boss Ingredients", "img": "boss-ingredients/sovereign-core.png", "name": "Sovereign Core", "id": "35081054", "short": "A rare core of concentrated boss power, used to complete the transformation of Azure Fury and Ward Crystals into Crimson.", "long": "A dense light presses against this core's fractured mineral shell, as though the darkness around it can barely contain what remains inside. Found only among the spoils of boss encounters, Sovereign Cores are rare even by the standards of the Last Span. Each serves as the final ingredient in a Crimson enhancement, giving the power awakened by Crown Embers a lasting center around which to settle.", "type": "Boss Crafting Ingredient", "note": null, "tags": ["Proposed ID"], "missing": []}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/verdant-fury-crystal.png", "name": "Verdant Fury Crystal", "id": "35080050", "short": "A rounded crystal holding a tightly bound pulse of violence. Empowers a favored weapon with additional damage, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Weapon Enhancement · Tier I", "note": "+20 weapon damage.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/verdant-ward-crystal.png", "name": "Verdant Ward Crystal", "id": "35080053", "short": "A rounded crystal whose steady inner light resists every fracture. Enhances a favored piece of armor with greater defense and maximum health, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Armor Enhancement · Tier I", "note": "Defense / max health amounts not set yet.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/azure-fury-crystal.png", "name": "Azure Fury Crystal", "id": "35080051", "short": "A rounded crystal holding a tightly bound pulse of violence. Empowers a favored weapon with additional damage, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Weapon Enhancement · Tier II", "note": "+40 weapon damage.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/azure-ward-crystal.png", "name": "Azure Ward Crystal", "id": "35080054", "short": "A rounded crystal whose steady inner light resists every fracture. Enhances a favored piece of armor with greater defense and maximum health, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Armor Enhancement · Tier II", "note": "Defense / max health amounts not set yet.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/crimson-fury-crystal.png", "name": "Crimson Fury Crystal", "id": "35080052", "short": "A rounded crystal holding a tightly bound pulse of violence. Empowers a favored weapon with additional damage, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Weapon Enhancement · Tier III", "note": "+60 weapon damage.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Enhancement Crystals", "img": "enhancement-crystals/crimson-ward-crystal.png", "name": "Crimson Ward Crystal", "id": "35080055", "short": "A rounded crystal whose steady inner light resists every fracture. Enhances a favored piece of armor with greater defense and maximum health, doubles its maximum durability, and fully repairs it when applied.", "long": null, "type": "Armor Enhancement · Tier III", "note": "Defense / max health amounts not set yet.", "tags": ["Proposed ID"], "missing": ["long"]}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/01_Arcwine_of_Concord.png", "name": "Arcwine of Concord", "id": "35051050", "short": "A luminous Concord vintage that steadies the body and restores the spirit.", "long": "Bottled for the salons of High Concord, this enchanted wine carries a restrained pulse of restorative magic. It satisfies thirst, offers light nourishment, gradually restores health, and sharpens stamina recovery without the crude burn of common spirits.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/02_Travelers_Feast.png", "name": "Traveler's Feast", "id": "35050050", "short": "A complete noble meal prepared to sustain even the longest journey.", "long": "Served in sealed travelware and prepared by High Concord's finest kitchens, this feast restores hunger and thirst in full. Its rich courses settle the body into a prolonged restorative state, healing steadily without granting combat power.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/03_Royal_Trail_Rations.png", "name": "Royal Trail Rations", "id": "35050051", "short": "Durable royal provisions made for expeditions far from civilization.", "long": "Compressed grains, cured fruit, and carefully preserved proteins are packed into a ration that survives where ordinary food spoils. Each portion offers dependable nourishment and a small measure of recovery, making longevity—not raw power—its greatest luxury.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/04_Concord_Coffee.png", "name": "Concord Coffee", "id": "35051051", "short": "A dark, aromatic brew that lets the drinker sprint almost without tiring.", "long": "Roasted in small batches for High Concord's couriers and sleepless diplomats, this potent coffee drives the legs with tireless urgency. For three minutes, sprinting draws only the faintest measure of stamina, allowing astonishing speed to be sustained across road or battlefield. Its discipline is narrow: attacks, dodges, climbing, and other exertions remain unchanged.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/05_Luxaran_Sweetbread.png", "name": "Luxaran Sweetbread", "id": "35050052", "short": "A soft golden pastry infused with honeyed restorative spices.", "long": "Luxaran bakers treat sweetness as both indulgence and medicine. These compact pastries restore hunger and gently mend minor wounds between encounters, offering refined comfort rather than battlefield-grade healing.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/06_Kings_Reserve_Ale.png", "name": "King's Reserve Ale", "id": "35051052", "short": "A royal cleansing ale that removes up to thirty percentage points of corruption.", "long": "Brewed under royal seal and aged far from corrupting influence, this celebrated ale produces a cleansing warmth powerful enough to drive supernatural taint from both body and spirit. A single serving can remove up to thirty percentage points of corruption. It is not a complete cure for the deeply afflicted, but few common restoratives command such immediate authority over corruption.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/07_Arcadian_Tea_Rerendered_Transparent.png", "name": "Arcadian Tea", "id": "35051053", "short": "A luminous herbal infusion with a calm, sustained restorative effect.", "long": "This pale tea is steeped from herbs associated with old Arcadian remedies. It restores thirst and gradually repairs the body over time, making it Lady Orienne's premier restorative drink without replacing true combat potions.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/08_Featherstep_Elixir.png", "name": "Featherstep Elixir", "id": "35052050", "short": "A moderate launch followed by 30 seconds of slow fall.", "long": "An ancient sorcerous working has been distilled into a modestly powerful silver-blue draught. A surge of power launches the drinker straight upward, far beyond the height of an ordinary jump, bringing lofty ledges within reach. For thirty seconds, gravity loosens its claim and falling becomes a drifting descent. Favored by climbers and daring explorers, Featherstep turns an unreachable path into an invitation to rise.\n\nThe alchemist who later devised Rocket Potion called this formula “just right.” It reached the workshop balcony, spared the roof, and left the monastery bells to the monks. His testing notes contain the rare and triumphant entry: “Landed on my feet. Both of them.”\n\nThen someone asked whether it could go higher. He insists this was not his fault.", "type": "Potion", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/09_Builders_Draught.png", "name": "Builder's Draught", "id": "35052051", "short": "Fifteen minutes of no stamina cost and +600 encumbrance; broken by physical damage.", "long": "This potent stimulant drives the drinker into an intense state of euphoric focus known among laborers as the builder's high. For fifteen minutes, exertion consumes no stamina and the body can bear six hundred additional measures of encumbrance. The state is exceptionally fragile, however—any physical damage shocks the drinker back to reality and immediately dispels its benefits.", "type": "Potion", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/12_Crystal_Focus.png", "name": "Crystal Focus", "id": "35052053", "short": "Removes stamina costs for thirty seconds.", "long": "Powdered arcane crystal gives this elixir its unnaturally lucid brilliance. Once consumed, body and intent fall into perfect alignment, allowing every exertion to be performed without fatigue for thirty seconds—in battle, in flight, or anywhere endurance would ordinarily fail. When the focus fractures, mortal limitations return at once.", "type": "Potion", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/13_Phoenix_Pepper.png", "name": "Phoenix Pepper", "id": "35054050", "short": "A rare ember-red pepper used in the finest heat-bound recipes.", "long": "Cultivated in volcanic soils and handled with ceremonial care, Phoenix Pepper is too valuable to waste as a simple snack. It serves as a premium ingredient for future foods, sauces, and event recipes associated with warmth and fire.", "type": "Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/14_Frost_Lotus_Tea.png", "name": "Frost Lotus Tea", "id": "35051054", "short": "A pale blue ceremonial tea that carries the chill of deep ice.", "long": "Frost lotus petals are steeped slowly to preserve their supernatural cold. The resulting tea provides dependable protection during travel through volcanic and desert regions, extending comfort rather than granting immunity to heat.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/15_Ember_Honey.png", "name": "Ember Honey", "id": "35050053", "short": "Rich volcanic honey that nourishes and warms from within.", "long": "Gathered near magma vents where ordinary hives could not survive, Ember Honey carries a deep, lingering warmth. It provides durable nourishment, gentle healing, and temporary protection against cold.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/16_Dragonfruit_Preserves.png", "name": "Dragonfruit Preserves", "id": "35050054", "short": "Bright imported preserves made to endure the longest expeditions.", "long": "Rare dragonfruit is sealed with sugar and spice to create a food that remains stable for an exceptional length of time. It offers strong nourishment and modest recovery, with preservation serving as its defining advantage.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/17_Luxaran_Chocolates.png", "name": "Luxaran Chocolates", "id": "35050055", "short": "Small prestige confections designed for discreet comfort between battles.", "long": "Luxaran chocolatiers shape these sweets into compact pieces that restore a little hunger and soothe minor injuries. Their individual effects are modest, but the box is valuable for travelers who prefer elegance to crude field rations.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/18_Moonberry_Tart.png", "name": "Moonberry Tart", "id": "35050056", "short": "A silver-purple tart that leaves the body unusually light and efficient.", "long": "Moonberries are baked into a delicate pastry served at High Concord evening gatherings. Beyond its refined flavor, the tart slightly reduces stamina consumption for a limited time, though the effect is kept mild enough to avoid defining combat.", "type": "Food", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/19_Sapphire_Wine.png", "name": "Sapphire Wine", "id": "35051055", "short": "An exquisite sapphire wine that completely purges corruption while restoring immense vitality over time.", "long": "This flawless blue vintage is uncorked only when body and spirit both stand near ruin. With each measured sip, its sapphire radiance draws every trace of corruption from the drinker while a profound restorative warmth steadily mends even grievous wounds. Few beverages are more costly, and fewer still can return a broken traveler so completely.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/20_Golden_Apple_Cider.png", "name": "Golden Apple Cider", "id": "35051056", "short": "A radiant golden cider that doubles maximum stamina for ten minutes.", "long": "Pressed from alchemically ripened golden apples, this luminous cider fills the body with a deep and lasting reserve of vigor. For ten minutes, the drinker's maximum stamina is doubled. Effort still demands its price, but draws from a reservoir twice as deep—making the cider prized by warriors, explorers, climbers, and anyone expecting a long trial ahead.", "type": "Drink", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/Fleetstride Tonic.png", "name": "Fleetstride Tonic", "id": "35052052", "short": "Doubles movement for thirty seconds.", "long": "Originally formulated for couriers who could not afford delay, this sharp tonic floods the limbs with impossible momentum. For thirty seconds, the drinker moves at twice their ordinary speed, whether racing across open country or maneuvering through battle. Pain cannot interrupt the rush; only time can exhaust it.", "type": "Potion", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/Wayfinders_Emberwisp_Icon.png", "name": "Wayfinder's Emberwisp", "id": "35053050", "short": "A living ember-spirit in a bottle; released, it follows the drinker as a light until its strength fades.", "long": "The enchanted bottle is both prison and preservative, holding one living ember-spirit in suspended decline. When the potion is consumed, the emberwisp slips free and attaches itself to the drinker, following closely and casting its warm light across darkened roads, forgotten ruins, and lightless depths. Freedom cannot restore what captivity preserved; once its remaining strength is spent, the spirit fades without smoke or ash—its final purpose fulfilled.", "type": "Utility", "note": null, "tags": [], "missing": []}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/Everbright Fuel.png", "name": "Everbright Fuel", "id": "35054051", "short": "A refined arcane fuel prized for its clean, enduring heat.", "long": "Purified until even its smoke has been driven away, this luminous fuel carries an exceptionally dense and tireless flame. A measured quantity can sustain furnaces, brewing vessels, and arcane apparatus far beyond the limits of common coal or oil. Everbright Fuel is costly to produce, but invaluable wherever steady heat and uninterrupted work matter more than thrift.", "type": "Fuel", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/Arcane_Binding_Solution_Icon.png", "name": "Arcane Binding Solution", "id": "35054055", "short": "A crystalline solution used to hold powerful temporary enchantments together.", "long": "Cloudless at rest and bright when disturbed, this binding solution gives unstable magical effects a vessel they can inhabit without immediately dispersing. Apothecaries use only a measured quantity; too little fails to hold the enchantment, while too much fixes it into something no longer safe to drink.", "type": "Crafting Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/Concord_Spice_Blend_Icon.png", "name": "Concord Spice Blend", "id": "35054052", "short": "A carefully measured seasoning blend used throughout High Concord's finest kitchens.", "long": "Salt, dried fruit, and imported spices are ground together according to a recipe guarded by Concord cooks. The blend lends a recognizable warmth and depth to noble meals without overwhelming their original character, allowing a small measure to distinguish true Crownlands fare from ordinary camp food.", "type": "Crafting Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/Crysolan_Frostleaf_Icon.png", "name": "Crysolan Frostleaf", "id": "35054056", "short": "A Crysolan-treated leaf that remains cold long after leaving the ice.", "long": "Frost lotus fibers are pressed against black ice and sealed with aloe before their supernatural chill can escape. Crysolan herbalists value the finished leaf because it preserves cold without becoming brittle, making it an ideal foundation for teas and other preparations meant to endure extreme heat.", "type": "Crafting Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/Luxaran_Golden_Syrup_Icon.png", "name": "Luxaran Golden Syrup", "id": "35054053", "short": "A luminous Luxaran syrup used to enrich prestigious foods and drinks.", "long": "Luxaran confectioners slowly clarify honey with golden lotus until it takes on the color of polished coin. The syrup is prized less for sweetness than for its ability to carry delicate enchantments evenly through pastries, preserves, wines, and ceremonial ciders.", "type": "Crafting Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/Sapphire_Distillate_Icon.png", "name": "Sapphire Distillate", "id": "35054057", "short": "A flawless blue concentrate prepared for the most demanding restorative vintages.", "long": "Repeated cleansing and distillation leave this fluid almost unnaturally pure. Its sapphire glow gathers corruption toward itself, yet the concentrate is too severe to drink safely on its own. Only careful dilution within a masterwork vintage turns that hunger for taint into restoration.", "type": "Crafting Ingredient", "note": null, "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/T_Altonis_Ingredient_CloudsilkDressing.png", "name": "Cloudsilk Dressing", "id": "35054059", "short": "A supple dressing woven from magically spun feather fibers, ready to carry the enchantments and adhesive preparations of a Featherstep Patch.", "long": "Soft ivory threads and pale blue fibers form a flexible dressing, woven to hold an enchantment without stiffening or tearing. Once treated with the proper binding mixture, Cloudsilk clings comfortably to the body and carries the prepared Featherstep sorcery through vigorous movement. This unfinished dressing offers no lift of its own. The inventor developed it after discovering that uncorking a bottle while falling requires rather more hands than he had brought. His tailor considers it his first sensible contribution.", "type": "Crafting Ingredient", "note": "Used in the Featherstep Patch.", "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/T_Altonis_Ingredient_SkyfireCatalyst.png", "name": "Skyfire Catalyst", "id": "35054060", "short": "An amber crystal with a restless, fiery heart, used to kindle the upward surge in Featherstep Elixir and Rocket Potion.", "long": "A warm amber shell surrounds a bright, restless heart that answers readily to bound wind sorcery. Carefully measured, Skyfire lends Featherstep Elixir its purposeful upward surge. A heavier measure, stirred with the volatile ingredients of Rocket Potion, encourages ambitions best discussed before uncorking. The crystal must be worked into a finished draught; swallowing it achieves nothing useful. The inventor once described a generous measure as “room for improvement.” The monastery’s bell keeper has requested that he improve in another direction.", "type": "Crafting Ingredient", "note": "Used in Featherstep Elixir and Rocket Potion.", "tags": [], "missing": []}, {"cat": "Ingredients", "img": "Altonis-Consumable-Icons-Final/T_Altonis_Ingredient_ZephyrSalt.png", "name": "Zephyr Salt", "id": "35054058", "short": "Airy, silver-blue crystals that carry the lifting and slow-falling enchantments of Featherstep preparations.", "long": "These delicate crystals hold a whisper of ascending air, lending Featherstep preparations their lightness and helping temper the return to earth. Zephyr Salt forms the common foundation of patches, elixirs, and the considerably less restrained Rocket Potion. It must be bound into a finished preparation before its sorcery can be put to useful work. The inventor recommends a tightly closed jar. His first batch escaped into the rafters, where it remains the most expensive dust in the workshop.", "type": "Crafting Ingredient", "note": "Used across the whole Featherstep family.", "tags": [], "missing": []}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Alchemy_Workstation_Icon_Flair_Final.png", "name": "Runebound Apothecary", "id": "35060051", "short": "A specialist station for Crownlands elixirs, tonics, emberwisp vessels, arcane fuels, and crystal preparations.", "long": "A dedicated apothecary placeable using ItemTable ID 35060051. Its internal Crafting Group 35061051 isolates advanced elixirs, emberwisp vessels, arcane fuels, and utility preparations from vanilla alchemy recipes while preserving a familiar station workflow.", "type": "Station", "note": "Icon filename: Alchemy Workstation. Mapping is Lori's inference via the recipe feats. Runebound Apothecary was formerly Arcane Apothecary.", "tags": ["Lori's inference"], "missing": []}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Cooking_Workstation_Icon_Flair_Final.png", "name": "Luxaran Grand Stove", "id": "35060050", "short": "A prestige culinary station for premium Crownlands food and hot-drink recipes.", "long": "A Luxaran-designed grand stove whose placeable ItemTable row is 35060050. Its recipes are routed through internal Crafting Group 35061050, keeping premium meals, preserves, teas, coffee, and confections separate from ordinary stove recipes.", "type": "Station", "note": "Icon filename: Cooking Workstation. Mapping is Lori's inference via the recipe feats.", "tags": ["Lori's inference"], "missing": []}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Distilling_Workstation_Icon_Flair_Final.png", "name": "Concord Brewing Vat", "id": "35060052", "short": "A dedicated brewing station for Crownlands wines, ales, ciders, and fermented drinks.", "long": "A Concord brewing placeable using ItemTable ID 35060052. Its internal Crafting Group 35061052 routes premium alcoholic and fermented recipes without importing every vanilla fermentation recipe into the station.", "type": "Station", "note": "Icon filename: Distilling Workstation. Mapping is Lori's inference via the recipe feats.", "tags": ["Lori's inference"], "missing": []}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Apothecary_Feat_Icon_Bright.png", "name": "Crownlands Alchemy", "id": "35011051", "short": "Learn to bind unstable enchantments and prepare powerful elixirs, arcane ingredients, and preserved spirits at the Arcane Apothecary.", "long": null, "type": "Crafting Feat", "note": "Icon filename: Apothecary Feat. Mapping is Lori's inference via the recipe feats.", "tags": ["Lori's inference"], "missing": ["long"]}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Cooking_Feat_Icon_Bright.png", "name": "Crownlands Cooking", "id": "35011050", "short": "Learn the celebrated culinary traditions of the Crownlands and prepare exceptional meals, teas, coffees, and culinary ingredients at the Luxaran Grand Stove.", "long": null, "type": "Crafting Feat", "note": "Icon filename: Cooking Feat. Mapping is Lori's inference via the recipe feats.", "tags": ["Lori's inference"], "missing": ["long"]}, {"cat": "Stations & Crafting Feats", "img": "Altonis-Consumable-Icons-Final/Crownlands_Distilling_Feat_Icon_Bright.png", "name": "Crownlands Distilling", "id": "35011052", "short": "Learn the guarded brewing traditions of the Crownlands and produce prestigious wines, ales, and ciders in the Concord Brewing Vat.", "long": null, "type": "Crafting Feat", "note": "Icon filename: Distilling Feat. Mapping is Lori's inference via the recipe feats.", "tags": ["Lori's inference"], "missing": ["long"]}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/ChatGPT Image Sep 27, 2026, 05_06_30 PM.png", "name": "Unnamed: ChatGPT Image Sep 27, ", "id": null, "short": null, "long": null, "type": "Unidentified", "note": "Unnamed file; needs a name.", "tags": [], "missing": ["id", "short", "long"]}, {"cat": "Consumables", "img": "Altonis-Consumable-Icons-Final/ChatGPT Image Sep 27, 2026, 05_06_51 PM.png", "name": "Unnamed: C -buff-icon-pack-v1/T_Altonis_Buff_Warmth.png", "name": "Warmth", "id": null, "short": "Timed buff granted by: Ember Honey.", "long": null, "type": "Buff / Status Icon", "note": null, "tags": [], "missing": ["id", "long"]}, {"cat": "Buff Icons", "img": "crownlands-buff-icon-pack-v1/T_Altonis_Buff_StaminaEfficiency.png", "name": "Stamina Efficiency", "id": null, "short": "Timed buff granted by: Moonberry Tart.", "long": null, "type": "Buff / Status Icon", "note": null, "tags": [], "missing": ["id", "long"]}, {"cat": "Buff Icons", "img": "crownlands-buff-icon-pack-v1/T_Altonis_Buff_MaxStamina.png", "name": "Maximum Stamina", "id": null, "short": "Timed buff granted by: Golden Apple Cider.", "long": null, "type": "Buff / Status Icon", "note": null, "tags": [], "missing": ["id", "long"]}, {"cat": "Buff Icons", "img": "crownlands-buff-icon-pack-v1/T_Altonis_Buff_CorruptionCleanse.png", "name": "Corruption Cleanse", "id": null, "short": "Instant action / bonus icon granted by: King's Reserve Ale; Sapphire Wine.", "long": null, "type": "Buff / Status Icon", "note": null, "tags": [], "missing": ["id", "long"]}, {"cat": "Buff Icons", "img": "crownlands-buff-icon-pack-v1/download.png", "name": "Unnamed: download", "id": null, "short": null, "long": null, "type": "Unidentified", "note": null, "tags": [], "missing": ["id", "short", "long"]}, {"cat": "Buff Icons", "img": "crownlands-buff-icon-pack-v1/exec-5c97d551-0632-48d5-adb6-4d6ecf1f7a6c.png", "name": "Unnamed: exec-5c97d551-0632-48d", "id": null, "short": null, "long": null, "type": "Unidentified", "note": null, "tags": [], "missing": ["id", "short", "long"]}, {"cat": "Scarheart", "img": "scarheart/soulanchor-rune.png", "name": "Soulanchor Rune", "id": "35000011", "short": "An Invocation Rune that grants Call Them Home. It does not add lives.", "long": "Three unfinished heartbeats pulse as one within this crimson rune. Scholars at the Last Span believe their joined rhythm can reach a soul even after the dungeon has claimed i const UN="Unresolved";let cur="All",q="";
const cats=[...new Set(ITEMS.map(i=>i.cat))];
const src=p=>encodeURI(p).replace(/#/g,"%23");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FL={id:"Item ID",short:"Short description",long:"Long description"};
document.getElementById("cnt").textContent=ITEMS.length+" entries · "+ITEMS.filter(i=>i.missing.length).length+" unresolved";
function tabs(){const t=document.getElementById("tabs");t.innerHTML="";
 ["All",...cats,UN].forEach(c=>{const b=document.createElement("button");b.className="tab"+(c==cur?" on":"")+(c==UN?" unres":"");
 const n=c=="All"?ITEMS.length:c==UN?ITEMS.filter(i=>i.missing.length).length:ITEMS.filter(i=>i.cat==c).length;
 b.textContent=c+" ("+n+")";b.onclick=()=>{cur=c;tabs();render()};t.appendChild(b)})}
function match(i){if(!q)return true;return [i.name,i.id,(i.tags||[]).join(" "),i.short,i.long,i.type,i.cat].join(" ").toLowerCase().includes(q)}
function render(){const m=document.getElementById("main");m.innerHTML="";
 const groups=cur=="All"?cats:cur==UN?[UN]:[cur];let any=0;
 groups.forEach(g=>{const list=ITEMS.map((x,k)=>[x,k]).filter(([x])=>(g==UN?x.missing.length:x.cat==g)&&match(x));if(!list.length)return;any=1;
  const p=document.createElement("section");p.className="panel";p.innerHTML="<h2>"+esc(g)+" — "+list.length+"</h2>";
  const gr=document.createElement("div");gr.className="grid";
  list.forEach(([x,k])=>{const s=document.createElement("div");s.className="slot";
   s.innerHTML='<img loading="lazy" src="'+src(x.img)+'" alt="">'+(x.missing.length?'<span class="flag"></span>':"")+'<div class="lbl">'+esc(x.name)+"</div>";
   s.onmousemove=e=>tip(e,x);s.onmouseleave=()=>T.style.display="none";s.onclick=()=>open_(k,g==UN);gr.appendChild(s)});
  p.appendChild(gr);m.appendChild(p)});
 if(!any)m.innerHTML='<div class="empty">No items match.</div>'}
const T=document.getElementById("tip");
function tip(e,x){T.innerHTML="<b>"+esc(x.name)+"</b>"+(x.short?esc(x.short):'<span class="tbd">Short description TBD</span>');
 T.style.display="block";T.style.left=Math.min(e.clientX+16,innerWidth-300)+"px";T.style.top=(e.clientY+16)+"px"}
let scrollY0=0;
function open_(k,fromUn){const x=ITEMS[k];scrollY0=scrollY;T.style.display="none";
 const d=document.getElementById("detail");
 const miss=x.missing.length?'<div class="miss"><b>Missing:</b> '+x.missing.map(f=>FL[f]).join(", ")+"</div>":"";
 d.innerHTML='<button class="back" onclick="closeD()">◀ Back to grid (Esc)</button><div class="insp"><div class="big"><img src="'+src(x.img)+'"></div><div>'+
 '<h3 class="name">'+esc(x.name)+'</h3><div class="meta"><span class="pill id'+(x.id?"":" tbd")+'">ID: '+esc(x.id||"TBD")+'</span><span class="pill">'+esc(x.cat)+"</span>"+(x.type?'<span class="pill">'+esc(x.type)+"</span>":"")+(x.tags||[]).map(g=>'<span class="pill tag">'+esc(g)+"</span>").join("")+"</div>"+
 (fromUn||x.missing.length?miss:"")+
 '<p class="short'+(x.short?"":" tbd")+'">'+esc(x.short||"Short description TBD")+"</p>"+
 '<p class="long'+(x.long?"":" tbd")+'">'+esc(x.long||"Long description TBD")+"</p>"+
 (x.note?'<div class="note">'+esc(x.note)+"</div>":"")+'<div class="file">'+esc(x.img)+"</div></div></div>";
 document.getElementById("gridview").style.display="none";d.style.display="block";scrollTo(0,0)}
function closeD(){document.getElementById("detail").style.display="none";document.getElementById("gridview").style.display="block";scrollTo(0,scrollY0)}
addEventListener("keydown",e=>{if(e.key=="Escape"&&document.getElementById("detail").style.display=="block")closeD()});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase().trim();render()};
tabs();render();
</script></body></html>
